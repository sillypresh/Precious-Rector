<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A beautiful digital clock displaying the current time across multiple time zones." />
    <title>World Clock | Precious Rector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="World Clock home">
          <span class="brand-mark" aria-hidden="true">◷</span>
          <span>WORLD CLOCK</span>
        </a>
        <div class="live-indicator"><span></span> LIVE</div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">TIME, EVERYWHERE</p>
        <h1 id="page-title">Your world,<br /><em>in sync.</em></h1>
        <p class="intro">Track the current time across the cities that matter most to you.</p>
        <div class="date-pill"><span class="calendar-icon" aria-hidden="true">▣</span><span id="local-date">Loading local date…</span></div>
      </section>

      <section class="clock-grid" id="clock-grid" aria-live="polite" aria-label="World clocks"></section>

      <footer class="footer">
        <p>Times update every second · Built with the <code>Intl.DateTimeFormat</code> API</p>
        <p class="credit">Designed &amp; built by <strong>Precious Rector</strong></p>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
